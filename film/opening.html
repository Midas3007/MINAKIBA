<body><canvas id="c"></canvas>
<script>
// MINAKIBA opening film. One scene: draw(t) renders time t (seconds). No wall clock, no unseeded randomness.
// Timing is on a 100 BPM grid (beat = 0.6 s) shared with score.py.

const q = new URLSearchParams(location.search)
const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080)
const TALL = H > W, DW = TALL ? 1080 : 1920, DH = TALL ? 1920 : 1080, K = W / DW
const cv = document.getElementById('c'); cv.width = W; cv.height = H
const ctx = cv.getContext('2d')
const fanCv = document.createElement('canvas'); fanCv.width = W; fanCv.height = H
const fctx = fanCv.getContext('2d')
window.DUR = 48

const C = { night: '#070B18', blue: '#0052FF', blueL: '#4D86FF', gold: '#E9C766', paper: '#F4F1E8', green: '#3DDC97',
  naira: '#9FB0D6', muted: '#8C98B8', panel: '#0D1430', line: '#1E2A4D' }
const F = { disp: "'MK Display'", text: "'MK Inter'", mono: "'MK Mono'" }

// ---------- small helpers ----------
const D2R = Math.PI / 180
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const sm = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) }          // smootherstep
const backOut = (x, s = 1.25) => { x = clamp(x); const y = x - 1; return 1 + (s + 1) * y * y * y + s * y * y }
const lerp = (a, b, k) => a + (b - a) * k
const lerpP = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
const col = (a, b = a, k = 0, al = 1) => { const A = hex(a), B = hex(b); return `rgba(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')},${al})` }
const font = (w, px, fam) => `${w} ${px}px ${fam}`
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const world = (c = ctx) => c.setTransform(K, 0, 0, K, 0, 0)

// ---------- timeline (seconds) ----------
const PULSES = [1.2, 1.8, 2.4, 3.0, 3.6]                  // gold point pulses = koto motif notes
const BLADES = [10.2, 10.8, 11.4, 12.0, 12.6]             // one blade per beat = one koto pluck each
const BLOCK_HIT = 14.4
const LETTERS0 = 18.6, ROOTS0 = 21.0                     // wordmark on eighths, roots on eighths
const PEAKS = [26.4, 28.8, 31.2]                          // gaps peak on the beat
const CARD0 = 34.2                                         // card k wraps 34.2+0.6k .. 35.4+0.6k
const WORDS = [
  [4.6, 8.4, 'For months, Kiyoshi traded the naira.'],
  [9.6, 13.6, 'Patiently. Precisely. Around the clock.'],
  [14.8, 17.8, 'Now it has a home on Base.'],
  [25.0, 27.3, 'Two markets.'],
  [27.6, 29.9, 'One gap.'],
  [30.2, 32.7, 'Every gap, golden.'],
  [36.9, 39.3, 'Dollars first. Naira underneath.'],
  [40.9, 44.5, 'The fund is open.', true],
]

// ---------- layout per aspect (designed separately, never squashed) ----------
const L = TALL ? {
  horizonY: 1250,
  logoA: { x: 540, y: 820, s: 560 },
  logoWM: { x: 540, y: 690, s: 360 }, wmFs: 104, wmBase: 1030, rootFs: 18, rootGap: 58,
  chart: { x0: 130, x1: 760, mid: 840, A: 50, sep: 36, Hb: 150, sigma: 0.075, labelX: 786, labFs: 20, gapFs: 32 },
  bumpsU: [0.26, 0.52, 0.78],
  cards: { xs: [160, 160, 160], ys: [470, 750, 1030], w: 760, h: 240, r: 18, pad: 36, titleFs: 30, figFs: 40, nairaFs: 22, oneLine: true },
  noteY: 1336,
  logoBig: { x: 540, y: 800, s: 600 },
  logoEnd: { x: 540, y: 640, s: 320 }, endWmFs: 96, endWmBase: 965, tagY: 1045, invY: 1108,
  fine: ['Not financial advice. Past results do not promise future returns.', 'You can lose money.'], fineY: 1590, fineFs: 19,
  words: { fs: 58, y: 1560, maxW: 860, lh: 72 },
} : {
  horizonY: 730,
  logoA: { x: 960, y: 450, s: 380 },
  logoWM: { x: 0, y: 450, s: 280 }, wmFs: 124, wmBase: 0, rootFs: 18, rootGap: 64,
  chart: { x0: 280, x1: 1580, mid: 500, A: 46, sep: 40, Hb: 130, sigma: 0.06, labelX: 1606, labFs: 18, gapFs: 30 },
  bumpsU: [0.28, 0.55, 0.8],
  cards: { xs: [270, 750, 1230], ys: [350, 350, 350], w: 420, h: 300, r: 18, pad: 32, titleFs: 26, figFs: 42, nairaFs: 22, oneLine: false },
  noteY: 708,
  logoBig: { x: 960, y: 440, s: 400 },
  logoEnd: { x: 960, y: 318, s: 230 }, endWmFs: 100, endWmBase: 572, tagY: 640, invY: 698,
  fine: ['Not financial advice. Past results do not promise future returns. You can lose money.'], fineY: 994, fineFs: 16,
  words: { fs: 50, y: 952, maxW: 1500, lh: 62 },
}

// ---------- text helpers ----------
function spacedText(c, s, x, y, spacingEm, px, align = 'center') {
  c.letterSpacing = (spacingEm * px) + 'px'
  const w = c.measureText(s).width - spacingEm * px      // drop trailing spacing
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x
  c.textAlign = 'left'; c.fillText(s, x0, y); c.letterSpacing = '0px'
  return w
}
function wrap(c, s, maxW) {
  const out = []; let cur = ''
  for (const w of s.split(' ')) { const n = cur ? cur + ' ' + w : w; if (c.measureText(n).width > maxW && cur) { out.push(cur); cur = w } else cur = n }
  out.push(cur)
  if (out.length === 2) {            // balance two lines so no word is left alone
    const ws = s.split(' '); let best = out, bw = Infinity
    for (let i = 1; i < ws.length; i++) { const a = ws.slice(0, i).join(' '), b = ws.slice(i).join(' '), m = Math.max(c.measureText(a).width, c.measureText(b).width); if (m <= maxW && m < bw) { bw = m; best = [a, b] } }
    return best
  }
  return out
}
function wmLayout(fs) {             // MINAKIBA, Inter Display 600, letter-spacing 0.2em
  ctx.font = font(600, fs, F.disp); ctx.letterSpacing = '0px'
  const xs = []; let x = 0
  for (const ch of 'MINAKIBA') { const w = ctx.measureText(ch).width; xs.push([x, w]); x += w + 0.2 * fs }
  return { xs, width: x - 0.2 * fs }
}

// ---------- logo geometry (100 x 100 box, exactly as the brand SVG) ----------
function logoT(c, o) { const k = K * o.s / 100; c.setTransform(k, 0, 0, k, K * (o.x - o.s / 2), K * (o.y - o.s / 2)) }
function bladePath(c, i, p) {
  const off = -(1 - Math.min(p, 1)) * 30 * D2R, R = 5 + 29 * p
  const a0 = (180 + i * 36 + 1.6) * D2R + off, a1 = (180 + (i + 1) * 36 - 1.6) * D2R + off
  c.beginPath()
  c.moveTo(50 + 5 * Math.cos(a0), 60 + 5 * Math.sin(a0)); c.lineTo(50 + R * Math.cos(a0), 60 + R * Math.sin(a0))
  c.arc(50, 60, R, a0, a1); c.lineTo(50 + 5 * Math.cos(a1), 60 + 5 * Math.sin(a1)); c.closePath()
}
function drawLogo(o) {
  if (o.glow > 0) {
    world(); const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.s * 1.15)
    g.addColorStop(0, col(C.blue, C.blue, 0, 0.32 * o.glow)); g.addColorStop(1, col(C.blue, C.blue, 0, 0))
    ctx.fillStyle = g; ctx.fillRect(o.x - o.s * 1.2, o.y - o.s * 1.2, o.s * 2.4, o.s * 2.4)
  }
  logoT(ctx, o)
  if (o.blockA > 0 && o.blockScale > 0) {
    ctx.save(); ctx.translate(50, 50); ctx.rotate(o.blockRot); ctx.scale(o.blockScale, o.blockScale)
    ctx.globalAlpha = o.blockA; ctx.fillStyle = C.blue; ctx.beginPath(); ctx.roundRect(-48, -48, 96, 96, 8); ctx.fill(); ctx.restore()
  }
  if (o.blades.some((b) => b.p > 0.001)) {          // fan on its own layer so the bars cut through it cleanly
    fctx.setTransform(1, 0, 0, 1, 0, 0); fctx.clearRect(0, 0, W, H); logoT(fctx, o); fctx.fillStyle = C.gold
    o.blades.forEach((b, i) => { if (b.p > 0.001) { fctx.globalAlpha = b.a; bladePath(fctx, i, b.p); fctx.fill() } })
    fctx.globalAlpha = 1; fctx.globalCompositeOperation = 'destination-out'
    fctx.fillRect(12 - o.cutPad, 40.2 - o.cutPad, 76 + 2 * o.cutPad, 2.6 + 2 * o.cutPad)
    fctx.fillRect(12 - o.cutPad, 47.6 - o.cutPad, 76 + 2 * o.cutPad, 2.6 + 2 * o.cutPad)
    fctx.globalCompositeOperation = 'source-over'
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(fanCv, 0, 0); logoT(ctx, o)
  }
  if (o.base > 0) { const hw = 35 * o.base; ctx.fillStyle = C.gold; ctx.beginPath(); ctx.roundRect(50 - hw, 61.2, 2 * hw, 3, Math.min(1.5, hw)); ctx.fill() }
  if (o.goldBarA > 0 && o.bars) {                  // the naira's two bars, drawn in gold before the block exists
    ctx.globalAlpha = o.goldBarA; ctx.fillStyle = C.gold
    const [p1, p2] = o.bars
    const b1 = lerp(14.6, 88, p1), b2 = lerp(85.4, 12, p2)
    ctx.beginPath(); ctx.roundRect(12, 40.2, b1 - 12, 2.6, 1.3 * (1 - p1)); ctx.fill()
    ctx.beginPath(); ctx.roundRect(b2, 47.6, 88 - b2, 2.6, 1.3 * (1 - p2)); ctx.fill()
    ctx.globalAlpha = 1
  }
  if (o.dots) {                                    // the gold point, and its split into two
    for (const d of o.dots) {
      const g = ctx.createRadialGradient(d[0], d[1], 0, d[0], d[1], d[2] * 7)
      g.addColorStop(0, col(C.gold, C.gold, 0, 0.35 * d[3])); g.addColorStop(1, col(C.gold, C.gold, 0, 0))
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d[0], d[1], d[2] * 7, 0, 7); ctx.fill()
      ctx.fillStyle = col(C.gold, C.gold, 0, d[3]); ctx.beginPath(); ctx.arc(d[0], d[1], d[2], 0, 7); ctx.fill()
    }
  }
  if (o.shimmer > 0 && o.shimmer < 1) {            // a gold shimmer crossing the block
    ctx.save(); ctx.beginPath(); ctx.roundRect(2, 2, 96, 96, 8); ctx.clip()
    const x = lerp(-60, 160, o.shimmer)
    const g = ctx.createLinearGradient(x - 22, x - 22 - 40, x + 22, x + 22 - 40)
    g.addColorStop(0, col(C.gold, C.gold, 0, 0)); g.addColorStop(0.5, col(C.gold, C.paper, 0.3, 0.32)); g.addColorStop(1, col(C.gold, C.gold, 0, 0))
    ctx.fillStyle = g; ctx.fillRect(0, 0, 100, 100); ctx.restore()
  }
  world()
}

// ---------- logo state over time ----------
function logoPos(t) {
  if (t < 17.8) return L.logoA
  if (t < 23.8) { const e = sm(seg(t, 17.8, 18.8)); return { x: lerp(L.logoA.x, L.logoWM.x, e), y: lerp(L.logoA.y, L.logoWM.y, e), s: lerp(L.logoA.s, L.logoWM.s, e) } }
  const e = sm(seg(t, 44.8, 45.8))
  return { x: lerp(L.logoBig.x, L.logoEnd.x, e), y: lerp(L.logoBig.y, L.logoEnd.y, e), s: lerp(L.logoBig.s, L.logoEnd.s, e) }
}
function logoState(t) {
  const o = { ...logoPos(t), blades: [], base: 0, blockA: 0, blockScale: 0, blockRot: 0, cutPad: 0, goldBarA: 0, glow: 0, shimmer: 0, dots: null, bars: null }
  if (t < 23.8) {
    // point -> two bars
    if (t < 5.0) {
      let r = 1.5
      for (const p of PULSES) if (t >= p - 0.02) r = 1.5 + 1.3 * Math.exp(-(t - p) / 0.16)
      const a = sm(seg(t, 0.7, 1.3)), e = sm(seg(t, 4.0, 5.0))
      const rr = lerp(r, 1.3, e)
      o.dots = [[lerp(50, 13.3, e), lerp(45.2, 41.5, e), rr, a], [lerp(50, 86.7, e), lerp(45.2, 48.9, e), rr, a * (e > 0 ? 1 : 0)]]
    } else {
      o.bars = [sm(seg(t, 5.0, 6.8)), sm(seg(t, 5.3, 7.1))]
      o.goldBarA = 1 - sm(seg(t, 14.6, 15.6))
    }
    o.base = sm(seg(t, 9.2, 10.0))
    o.cutPad = 1.2 * (1 - sm(seg(t, 14.6, 15.6)))
    // fan opens blade by blade; folds back down into the base line at 23 s
    o.blades = BLADES.map((T, i) => {
      if (t < 22.9) { const r = seg(t, T - 0.04, T + 0.5); return { p: backOut(r), a: clamp(r * 4) } }
      const s0 = 23.0 + (4 - i) * 0.08, p = 1 - sm(seg(t, s0, s0 + 0.5)); return { p, a: clamp(p * 3) }
    })
    // the blue block grows behind, from a diamond to a square
    const r = seg(t, 14.3, 15.5), out = sm(seg(t, 23.0, 23.8))
    o.blockScale = lerp(0.15 + 0.85 * backOut(r, 1.1), 0.15, out)
    o.blockRot = 45 * D2R * lerp(1 - sm(r), 1, out)
    o.blockA = clamp(r * 3) * (1 - out)
    o.glow = 0.5 * o.blockA
    if (t >= 23.7) o.base = 0                       // the base line leaves as the market line
    if (out >= 1) o.blades = []
    return o
  }
  if (t < 40.7) return null
  // final: cards fold back into the logo
  o.blockA = 1; o.blockScale = 1
  o.base = sm(seg(t, 40.5, 41.0))
  o.blades = BLADES.map((_, i) => { const r = seg(t, 40.7 + 0.12 * i, 41.25 + 0.12 * i); return { p: backOut(r), a: clamp(r * 4) } })
  o.glow = 0.5 + 0.5 * sm(seg(t, 41, 44.5)) - 0.35 * sm(seg(t, 44.8, 45.8))
  o.shimmer = seg(t, 42.4, 43.7)
  return o
}

// ---------- the market lines ----------
const NL = 161
function baseLinePts(o) {           // the logo's gold base line as a polyline (logo units 16.5..83.5 at y 62.7)
  const pts = []
  for (let i = 0; i < NL; i++) { const ux = lerp(16.5, 83.5, i / (NL - 1)); pts.push([o.x + (ux - 50) * o.s / 100, o.y + (62.7 - 50) * o.s / 100]) }
  return pts
}
function bumpAmp(t, k) { const P = PEAKS[k]; return sm(seg(t, P - 0.9, P)) * (1 - sm(seg(t, P + 0.5, P + 1.5))) }
function lineY(u, t, which, amt) {
  const c = L.chart
  const wave = c.A * (0.6 * Math.sin(2 * Math.PI * 0.9 * u + 0.5 * t) + 0.4 * Math.sin(2 * Math.PI * 2.1 * u - 0.8 * t + 1.3))
  let off = c.sep / 2
  const W8 = [0.65, 0.35, 0.6]
  L.bumpsU.forEach((uk, k) => { const b = bumpAmp(t, k) * Math.exp(-(((u - uk) / c.sigma) ** 2)) * c.Hb; off += b * (which === 0 ? W8[k] : 1 - W8[k]) })
  return c.mid + amt * (wave + (which === 0 ? -off : off))
}
function marketLines(t) {           // 23.7 .. 33.8
  const c = L.chart, o = L.logoWM
  const flow = sm(seg(t, 23.7, 24.9)), amt = sm(seg(t, 24.7, 25.7)) * (1 - sm(seg(t, 32.8, 33.8)))
  const base = baseLinePts(logoPos(23.7))
  const width = lerp(3 * o.s / 100, 3, flow)
  const lines = [0, 1].map((w) => {
    const pts = []
    for (let i = 0; i < NL; i++) { const u = i / (NL - 1); const flat = [lerp(c.x0, c.x1, u), lineY(u, t, w, amt)]; pts.push(lerpP(base[i], flat, flow)) }
    return pts
  })
  // golden gaps
  L.bumpsU.forEach((uk, k) => {
    const a = bumpAmp(t, k) * amt; if (a <= 0.001) return
    const u0 = uk - 2.2 * c.sigma, u1 = uk + 2.2 * c.sigma, x0 = lerp(c.x0, c.x1, u0), x1 = lerp(c.x0, c.x1, u1)
    const g = ctx.createLinearGradient(x0, 0, x1, 0)
    g.addColorStop(0, col(C.gold, C.gold, 0, 0)); g.addColorStop(0.5, col(C.gold, C.gold, 0, 0.55 * a)); g.addColorStop(1, col(C.gold, C.gold, 0, 0))
    ctx.fillStyle = g; ctx.beginPath()
    const n = 40
    for (let i = 0; i <= n; i++) { const u = lerp(u0, u1, i / n); ctx.lineTo(lerp(c.x0, c.x1, u), lineY(u, t, 0, amt)) }
    for (let i = n; i >= 0; i--) { const u = lerp(u0, u1, i / n); ctx.lineTo(lerp(c.x0, c.x1, u), lineY(u, t, 1, amt)) }
    ctx.fill()
  })
  const colors = [col(C.gold, C.blueL, amt), col(C.gold, C.paper, amt)]
  lines.forEach((pts, w) => stroke(pts, colors[w], width))
  // labels and the profit that rises out of each gap
  const la = sm(seg(t, 25.4, 26.0)) * (1 - sm(seg(t, 32.4, 33.0)))
  if (la > 0) {
    ctx.font = font(500, c.labFs, F.mono)
    ctx.fillStyle = col(C.blueL, C.blueL, 0, la); ctx.textBaseline = 'middle'; spacedText(ctx, 'UNISWAP', c.labelX, lineY(1, t, 0, amt) - 6, 0.2, c.labFs, 'left')
    ctx.fillStyle = col(C.paper, C.paper, 0, la); spacedText(ctx, 'TEXTILE', c.labelX, lineY(1, t, 1, amt) + 6, 0.2, c.labFs, 'left')
    ctx.textBaseline = 'alphabetic'
  }
  L.bumpsU.forEach((uk, k) => {
    const P = PEAKS[k], a = sm(seg(t, P - 0.25, P + 0.15)) * (1 - sm(seg(t, P + 1.0, P + 1.5))); if (a <= 0) return
    const rise = sm(seg(t, P - 0.25, P + 1.5)), x = lerp(c.x0, c.x1, uk), top = lineY(uk, t, 0, amt)
    const yN = top - 30 - 26 * rise
    ctx.textAlign = 'center'
    ctx.font = font(500, c.gapFs * 0.68, F.mono); ctx.fillStyle = col(C.naira, C.naira, 0, a); ctx.fillText('₦976', x, yN)
    ctx.font = font(500, c.gapFs, F.mono); ctx.fillStyle = col(C.gold, C.gold, 0, a); ctx.fillText('+$0.61', x, yN - c.gapFs * 0.95)
  })
}
function stroke(pts, color, width, close = false) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath()
  pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); if (close) ctx.closePath(); ctx.stroke()
}

// ---------- the three cards (line -> segments -> rounded rectangles -> the logo block) ----------
const NP = 240
function rrectPoint(cx, cy, w, h, r, d) {          // d = clockwise distance from top-middle
  const sides = [['L', w / 2 - r], ['A', Math.PI * r / 2], ['L', h - 2 * r], ['A', Math.PI * r / 2], ['L', w - 2 * r], ['A', Math.PI * r / 2], ['L', h - 2 * r], ['A', Math.PI * r / 2], ['L', w / 2 - r]]
  const P = sides.reduce((s, x) => s + x[1], 0); d = ((d % P) + P) % P
  const x0 = cx - w / 2, y0 = cy - h / 2, x1 = cx + w / 2, y1 = cy + h / 2
  const corners = [[x1 - r, y0 + r, -90], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, 90], [x0 + r, y0 + r, 180]]
  const lines = [[[cx, y0], [x1 - r, y0]], [[x1, y0 + r], [x1, y1 - r]], [[x1 - r, y1], [x0 + r, y1]], [[x0, y1 - r], [x0, y0 + r]], [[x0 + r, y0], [cx, y0]]]
  let li = 0, ci = 0
  for (const [kind, len] of sides) {
    if (d <= len || (kind === 'L' && li === 4)) {
      if (kind === 'L') { const [a, b] = lines[li]; return lerpP(a, b, len ? d / len : 0) }
      const [ox, oy, a0] = corners[ci]; const a = (a0 + 90 * d / len) * D2R; return [ox + r * Math.cos(a), oy + r * Math.sin(a)]
    }
    d -= len; kind === 'L' ? li++ : ci++
  }
  return [cx, y0]
}
function perim(cx, cy, w, h, r) {
  const P = 2 * (w + h) - 8 * r + 2 * Math.PI * r, pts = []
  for (let i = 0; i < NP; i++) pts.push(rrectPoint(cx, cy, w, h, r, (i / (NP - 1) - 0.5) * P))
  return pts
}
const CARDS = [
  { n: '01', cap: 'YOU DEPOSIT', title: 'Deposit USDC on Base', usd: '$1,000', ngn: '₦1,600,000', usdCol: C.paper },
  { n: '02', cap: 'ONE TRADE', title: 'Kiyoshi trades the naira', usd: '+$0.61', ngn: '₦976', usdCol: C.green },
  { n: '03', cap: 'SHARE PRICE', title: 'Profit settles into your shares every day', usd: '$1.0042', ngn: '₦1,607', usdCol: C.paper },
]
function cardPieces(t) {             // 33.8 .. 40.7
  const c = L.chart, cd = L.cards, B = L.logoBig
  const e1 = sm(seg(t, 33.8, 34.7)), e3 = sm(seg(t, 39.5, 40.7))
  const block = perim(B.x, B.y, 0.96 * B.s, 0.96 * B.s, 0.08 * B.s)
  const fillCol = sm(seg(t, 40.0, 40.7)), outA = 1 - sm(seg(t, 40.2, 40.65))
  for (let k = 0; k < 3; k++) {
    const x = cd.xs[k], y = cd.ys[k], cx = x + cd.w / 2, cy = y + cd.h / 2
    const box = perim(cx, cy, cd.w, cd.h, cd.r)
    const w0 = CARD0 + 0.6 * k, e2 = sm(seg(t, w0, w0 + 1.2))
    const pts = []
    for (let i = 0; i < NP; i++) {
      const s = i / (NP - 1), u = (k + s) / 3
      const slice = [lerp(c.x0, c.x1, u), c.mid], line = [x + s * cd.w, cy]
      pts.push(lerpP(lerpP(lerpP(slice, line, e1), box[i], e2), block[i], e3))
    }
    const fa = sm(seg(t, w0 + 1.0, w0 + 1.6))
    if (fa > 0) {
      ctx.fillStyle = col(C.panel, C.blue, fillCol, Math.max(fa, e3 > 0 ? 1 : 0)); ctx.beginPath()
      pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.fill()
    }
    const toLine = sm(seg(t, w0 + 1.2, w0 + 1.8)) * (1 - e3)
    stroke(pts, col(C.gold, C.line, toLine, outA), lerp(3, 2, e2), e2 >= 1)
    if (fa > 0 && toLine > 0 && e3 < 1) {           // a thin gold accent stays on the card's top edge
      ctx.strokeStyle = col(C.gold, C.gold, 0, 0.7 * toLine * (1 - sm(seg(t, 39.0, 39.45)))); ctx.lineWidth = 2
      ctx.beginPath(); ctx.moveTo(x + cd.r + 6, y); ctx.lineTo(x + cd.r + 70, y); ctx.stroke()
    }
    const ca = sm(seg(t, w0 + 1.3, w0 + 1.9)) * (1 - sm(seg(t, 39.0, 39.45)))
    if (ca > 0) cardContent(k, x, y, ca, sm(seg(t, w0 + 1.3, w0 + 1.9)))
  }
  const na = sm(seg(t, 37.0, 37.6)) * (1 - sm(seg(t, 39.0, 39.45)))
  if (na > 0) { ctx.font = font(400, TALL ? 18 : 15, F.mono); ctx.fillStyle = col(C.muted, C.muted, 0, na); spacedText(ctx, 'EXAMPLE FIGURES AT ₦1,600 / $1', DW / 2, L.noteY, 0.2, TALL ? 18 : 15) }
}
function cardContent(k, x, y, a, e) {
  const cd = L.cards, d = CARDS[k], p = cd.pad, dy = 10 * (1 - e)
  ctx.textAlign = 'left'
  ctx.font = font(500, 16, F.mono); ctx.fillStyle = col(C.gold, C.gold, 0, a); ctx.fillText(d.n, x + p, y + 46 + dy)
  ctx.font = font(400, 14, F.mono); ctx.fillStyle = col(C.muted, C.muted, 0, a); spacedText(ctx, d.cap, x + p + 38, y + 46 + dy, 0.2, 14, 'left')
  ctx.fillStyle = col(C.paper, C.paper, 0, a)
  let tf = cd.titleFs; ctx.font = font(500, tf, F.text)
  if (cd.oneLine) { while (ctx.measureText(d.title).width > cd.w - 2 * p && tf > 20) { tf--; ctx.font = font(500, tf, F.text) } ctx.fillText(d.title, x + p, y + 96 + dy) }
  else wrap(ctx, d.title, cd.w - 2 * p).forEach((ln, i) => ctx.fillText(ln, x + p, y + 94 + i * 34 + dy))
  const fy = cd.oneLine ? y + 170 : y + 232, ny = cd.oneLine ? y + 206 : y + 266
  ctx.font = font(500, cd.figFs, F.mono); ctx.fillStyle = col(d.usdCol, d.usdCol, 0, a); ctx.fillText(d.usd, x + p, fy + dy)
  ctx.font = font(400, cd.nairaFs, F.mono); ctx.fillStyle = col(C.naira, C.naira, 0, a); ctx.fillText(d.ngn, x + p, ny + dy)
}

// ---------- wordmark and roots ----------
let WM = null, WMEND = null
function setupLayout() {
  WM = wmLayout(L.wmFs); WMEND = wmLayout(L.endWmFs)
  if (!TALL) {                       // logo left, wordmark right, the pair centred on the frame
    const gap = 80, gw = L.logoWM.s + gap + WM.width
    L.logoWM.x = DW / 2 - gw / 2 + L.logoWM.s / 2
    L.wmX = L.logoWM.x + L.logoWM.s / 2 + gap
    L.wmBase = L.logoWM.y + 0.727 * L.wmFs / 2
  } else L.wmX = DW / 2 - WM.width / 2
}
function drawWordmark(t) {           // 18.6 .. 23.4
  const out = sm(seg(t, 22.9, 23.4)); if (out >= 1) return
  const fs = L.wmFs, roots = ['MIDAS', 'NAIRA', 'KIYOSHI', 'BASE']
  ctx.font = font(600, fs, F.disp); ctx.textAlign = 'left'
  WM.xs.forEach(([lx], i) => {
    const T = LETTERS0 + 0.3 * i, e = sm(seg(t, T - 0.05, T + 0.4)); if (e <= 0) return
    const R = ROOTS0 + 0.3 * (i >> 1), glow = t > R ? Math.exp(-(t - R) / 0.55) : 0
    ctx.fillStyle = col(C.paper, C.gold, glow, e * (1 - out))
    ctx.fillText('MINAKIBA'[i], L.wmX + lx, L.wmBase + 16 * (1 - e) - 10 * out)
  })
  ctx.font = font(500, L.rootFs, F.mono)
  roots.forEach((r, j) => {
    const R = ROOTS0 + 0.3 * j, e = sm(seg(t, R, R + 0.45)); if (e <= 0) return
    const [a] = WM.xs[2 * j], [b, bw] = WM.xs[2 * j + 1], cx = L.wmX + (a + b + bw) / 2
    ctx.fillStyle = col(C.muted, C.muted, 0, e * (1 - out))
    spacedText(ctx, r, cx, L.wmBase + L.rootGap + 10 * (1 - e) - 10 * out, 0.2, L.rootFs)
  })
}
function drawEndCard(t) {            // 45.2 ..
  const fs = L.endWmFs, x0 = DW / 2 - WMEND.width / 2
  ctx.font = font(600, fs, F.disp); ctx.textAlign = 'left'
  WMEND.xs.forEach(([lx], i) => {
    const e = sm(seg(t, 45.55 + 0.06 * i, 46.1 + 0.06 * i)); if (e <= 0) return
    ctx.fillStyle = col(C.paper, C.paper, 0, e); ctx.fillText('MINAKIBA'[i], x0 + lx, L.endWmBase + 14 * (1 - e))
  })
  const a1 = sm(seg(t, 45.9, 46.4)), a2 = sm(seg(t, 46.05, 46.55)), a3 = sm(seg(t, 46.1, 46.6))
  const tf = TALL ? 22 : 20
  ctx.font = font(500, tf, F.mono); ctx.fillStyle = col(C.gold, C.gold, 0, a1); spacedText(ctx, 'A MIDAS × KIYOSHI FUND ON BASE', DW / 2, L.tagY + 8 * (1 - a1), 0.25, tf)
  ctx.font = font(400, TALL ? 28 : 24, F.text); ctx.fillStyle = col(C.muted, C.muted, 0, a2); ctx.textAlign = 'center'; ctx.fillText('By invitation', DW / 2, L.invY + 8 * (1 - a2))
  ctx.font = font(400, L.fineFs, F.mono); ctx.fillStyle = col(C.muted, C.muted, 0, a3)
  L.fine.forEach((ln, i) => { ctx.textAlign = 'center'; ctx.fillText(ln, DW / 2, L.fineY + i * L.fineFs * 1.7) })
}

// ---------- words (one sentence at a time, centred low) ----------
function drawWords(t) {
  for (const [a, b, s, big] of WORDS) {
    const al = sm(seg(t, a, a + 0.5)) * (1 - sm(seg(t, b - 0.5, b))); if (al <= 0) continue
    const w = L.words, fs = big ? Math.round(w.fs * 1.25) : w.fs
    ctx.font = font(big ? 600 : 500, fs, F.disp); ctx.textAlign = 'center'; ctx.fillStyle = col(C.paper, C.paper, 0, al)
    const lines = wrap(ctx, s, w.maxW), lh = big ? w.lh * 1.2 : w.lh, dy = 8 * (1 - sm(seg(t, a, a + 0.6)))
    lines.forEach((ln, i) => ctx.fillText(ln, DW / 2, w.y + (i - (lines.length - 1) / 2) * lh + dy))
  }
}

// ---------- atmosphere ----------
const GRAIN = [1, 2, 3].map((seed) => {
  const g = document.createElement('canvas'); g.width = g.height = 256; const gc = g.getContext('2d'), im = gc.createImageData(256, 256), r = mulberry32(seed * 977)
  for (let i = 0; i < im.data.length; i += 4) { im.data[i] = im.data[i + 1] = im.data[i + 2] = 255; im.data[i + 3] = Math.floor(r() * 12) }
  gc.putImageData(im, 0, 0); return ctx.createPattern(g, 'repeat')
})
function background(t) {
  world(); ctx.fillStyle = C.night; ctx.fillRect(0, 0, DW, DH)
  const h = sm(seg(t, 0.6, 3.4)) * (1 - sm(seg(t, 15.0, 18.5)))
  if (h > 0) {
    const y = L.horizonY
    ctx.save(); ctx.translate(DW / 2, y); ctx.scale(DW * 0.55, TALL ? 90 : 70)
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); g.addColorStop(0, col(C.blue, C.blue, 0, 0.22 * h)); g.addColorStop(1, col(C.blue, C.blue, 0, 0))
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, 7); ctx.fill(); ctx.restore()
    const lg = ctx.createLinearGradient(0, 0, DW, 0)
    lg.addColorStop(0, col(C.blueL, C.blueL, 0, 0)); lg.addColorStop(0.5, col(C.blueL, C.blueL, 0, 0.75 * h)); lg.addColorStop(1, col(C.blueL, C.blueL, 0, 0))
    ctx.fillStyle = lg; ctx.fillRect(0, y - 0.75, DW, 1.5)
  }
}
function finish(t) {
  world()
  const v = ctx.createRadialGradient(DW / 2, DH / 2, Math.min(DW, DH) * 0.35, DW / 2, DH / 2, Math.hypot(DW, DH) / 2)
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)'); ctx.fillStyle = v; ctx.fillRect(0, 0, DW, DH)
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = GRAIN[Math.floor(t * 30 + 1e-6) % 3]; ctx.fillRect(0, 0, W, H)
  const black = Math.max(1 - sm(seg(t, 0, 1.6)), sm(seg(t, 47.1, 47.95)))
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H) }
}

// ---------- the scene ----------
window.draw = function (t) {
  if (!WM) setupLayout()
  ctx.textBaseline = 'alphabetic'
  background(t)
  const o = logoState(t)
  if (o) drawLogo(o)
  if (t >= 18 && t < 23.4) drawWordmark(t)
  if (t >= 23.7 && t < 33.8) marketLines(t)
  if (t >= 33.8 && t < 40.7) cardPieces(t)
  if (t >= 45.2) drawEndCard(t)
  drawWords(t)
  finish(t)
}
window.READY = Promise.all([
  document.fonts.load(font(600, 40, F.disp)), document.fonts.load(font(500, 40, F.disp)),
  document.fonts.load(font(400, 40, F.text)), document.fonts.load(font(500, 40, F.text)),
  document.fonts.load(font(400, 40, F.mono)), document.fonts.load(font(500, 40, F.mono)),
]).then(() => document.fonts.ready).then(() => { setupLayout(); return true })
if (!q.has('norender')) window.READY.then(() => draw(+(q.get('t') || 0)))
</script></body></html>
